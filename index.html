<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 탭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary:#202124;--bg-secondary:#303134;--bg-tertiary:#3c4043;--bg-hover:#404347;
    --text-primary:#e8eaed;--text-secondary:#9aa0a6;--text-muted:#6e7479;
    --accent:#8ab4f8;--accent-hover:#aecbfa;--accent-dim:rgba(138,180,248,0.12);
    --danger:#f28b82;--danger-dim:rgba(242,139,130,0.12);
    --success:#81c995;--success-dim:rgba(129,201,149,0.15);
    --warning:#fdd663;--warning-dim:rgba(253,214,99,0.15);
    --border:#5f6368;--shadow:rgba(0,0,0,0.4);--radius:12px;--radius-sm:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-primary);color:var(--text-primary);font-family:'Outfit','Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-y:auto;}

  /* Auth */
  .auth-bar{position:fixed;top:12px;right:16px;z-index:50;display:flex;align-items:center;gap:10px;}
  .auth-bar .user-name{font-size:12px;color:var(--text-secondary);}
  .auth-bar .user-avatar{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid var(--bg-tertiary);}
  .btn-auth{padding:6px 16px;background:var(--accent);color:#202124;border:none;border-radius:20px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s;}
  .btn-auth:hover{background:var(--accent-hover);}
  .btn-auth.logout{background:var(--bg-tertiary);color:var(--text-secondary);font-weight:400;}
  .btn-auth.logout:hover{background:var(--bg-hover);}
  .sync-badge{font-size:11px;color:var(--success);display:flex;align-items:center;gap:4px;}
  .sync-badge::before{content:'';width:6px;height:6px;background:var(--success);border-radius:50%;display:inline-block;}

  /* Bookmark */
  .bookmark-bar{margin-top:48px;margin-bottom:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 16px;}
  .bm-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:20px;text-decoration:none;color:var(--text-secondary);font-size:13px;font-family:inherit;transition:all .15s;white-space:nowrap;}
  .bm-pill:hover{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--border);box-shadow:0 1px 4px var(--shadow);}
  .bm-emoji{font-size:15px;line-height:1;}

  /* Search */
  .search-container{margin-top:0;margin-bottom:36px;width:100%;max-width:584px;position:relative;}
  .search-logo{text-align:center;margin-bottom:28px;font-size:64px;font-weight:700;letter-spacing:-2px;background:linear-gradient(135deg,#4285f4 0%,#ea4335 25%,#fbbc05 50%,#34a853 75%,#4285f4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .search-bar{width:100%;height:48px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:24px;display:flex;align-items:center;padding:0 18px;transition:all .2s ease;cursor:text;}
  .search-bar:hover,.search-bar:focus-within{background:var(--bg-tertiary);border-color:var(--border);box-shadow:0 2px 8px var(--shadow);}
  .search-icon{color:var(--text-secondary);margin-right:12px;flex-shrink:0;}
  .search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-size:16px;font-family:inherit;}
  .search-bar input::placeholder{color:var(--text-secondary);}

  /* Shortcuts */
  .shortcuts-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:680px;margin-bottom:44px;padding:0 16px;}
  .shortcut{display:flex;flex-direction:column;align-items:center;width:96px;text-decoration:none;cursor:pointer;border-radius:var(--radius);padding:12px 4px;transition:background .15s;}
  .shortcut:hover{background:var(--bg-secondary);}
  .shortcut-icon{width:48px;height:48px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;}
  .shortcut-icon img{width:24px;height:24px;border-radius:2px;}
  .shortcut-label{font-size:12px;color:var(--text-secondary);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;}

  /* Modal (shared) */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal{background:var(--bg-secondary);border-radius:var(--radius);padding:24px;width:420px;max-width:90vw;box-shadow:0 8px 32px var(--shadow);}
  .modal h3{font-size:16px;margin-bottom:16px;}
  .modal label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;}
  .modal input,.modal select{width:100%;height:38px;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:0 12px;color:var(--text-primary);font-size:14px;font-family:inherit;outline:none;margin-bottom:14px;transition:border-color .2s;}
  .modal input:focus,.modal select:focus{border-color:var(--accent);}
  .modal select option{background:var(--bg-primary);color:var(--text-primary);}
  .modal-row{display:flex;gap:12px;}
  .modal-row>div{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .modal-actions button{padding:8px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;}
  .btn-cancel{background:var(--bg-tertiary);color:var(--text-primary);}.btn-cancel:hover{background:var(--bg-hover);}
  .btn-save{background:var(--accent);color:#202124;font-weight:600;}.btn-save:hover{background:var(--accent-hover);}
  .btn-danger{background:var(--danger-dim);color:var(--danger);}.btn-danger:hover{background:var(--danger);color:#202124;}

  /* Planner layout */
  .planner{display:flex;gap:16px;width:100%;max-width:1100px;padding:0 16px;margin-bottom:60px;align-items:flex-start;}
  .planner-left{display:flex;flex-direction:column;gap:12px;width:320px;flex-shrink:0;}
  .planner-right{flex:1;min-width:0;}
  .panel{background:var(--bg-secondary);border-radius:var(--radius);padding:16px;}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .panel-title{font-size:14px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;}
  .panel-sub{font-size:10px;color:var(--text-muted);font-weight:400;}
  .panel-add{padding:4px 10px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(138,180,248,0.25);border-radius:14px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .15s;}
  .panel-add:hover{background:var(--accent);color:#202124;border-color:var(--accent);}

  /* Daily Job */
  .dj-input-row{display:flex;gap:6px;margin-bottom:10px;}
  .dj-input{flex:1;height:32px;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:0 10px;color:var(--text-primary);font-size:12px;font-family:inherit;outline:none;}
  .dj-input:focus{border-color:var(--accent);}
  .dj-add{padding:0 12px;background:var(--accent);color:#202124;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;}
  .dj-add:hover{background:var(--accent-hover);}
  .dj-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent;}
  .dj-list::-webkit-scrollbar{width:5px;}.dj-list::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px;}
  .dj-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-primary);border-radius:var(--radius-sm);cursor:grab;}
  .dj-item:hover{background:var(--bg-tertiary);}
  .dj-item.done{opacity:.5;}
  .dj-item.done .dj-text{text-decoration:line-through;color:var(--text-muted);}
  .dj-check{width:16px;height:16px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .dj-item.done .dj-check{background:var(--success-dim);border-color:var(--success);}
  .dj-check svg{display:none;color:var(--success);}
  .dj-item.done .dj-check svg{display:block;}
  .dj-text{flex:1;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dj-del{width:20px;height:20px;border:none;background:none;color:var(--text-muted);cursor:pointer;opacity:0;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .dj-item:hover .dj-del{opacity:1;}
  .dj-del:hover{background:var(--danger-dim);color:var(--danger);}
  .empty-msg{text-align:center;padding:14px;color:var(--text-muted);font-size:12px;}

  /* Brain Dump */
  .brain-list{display:flex;flex-direction:column;gap:6px;max-height:480px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent;}
  .brain-list::-webkit-scrollbar{width:5px;}.brain-list::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px;}
  .brain-item{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:var(--bg-primary);border-radius:var(--radius-sm);border-left:3px solid var(--text-muted);cursor:grab;}
  .brain-item:hover{background:var(--bg-tertiary);}
  .brain-row{display:flex;align-items:center;gap:6px;}
  .brain-cat{font-size:9px;padding:2px 7px;border-radius:10px;color:#202124;font-weight:700;flex-shrink:0;}
  .brain-name{flex:1;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brain-meta{font-size:10px;color:var(--text-muted);}

  /* Time Plan */
  .tp-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px;}
  .tp-nav{width:32px;height:32px;background:var(--bg-secondary);border:none;border-radius:50%;color:var(--text-secondary);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
  .tp-nav:hover{background:var(--bg-tertiary);color:var(--text-primary);}
  .tp-date-wrap{flex:1;display:flex;align-items:center;gap:6px;}
  .tp-date-wrap input[type=date]{background:none;border:none;color:var(--text-primary);font:600 15px 'Outfit','Noto Sans KR',sans-serif;outline:none;cursor:pointer;color-scheme:dark;}
  .tp-dow{font-size:13px;color:var(--text-muted);}
  .tp-today{padding:6px 14px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:12px;font-family:inherit;cursor:pointer;}
  .tp-today:hover{background:var(--bg-tertiary);color:var(--text-primary);}

  .time-grid{position:relative;background:var(--bg-secondary);border-radius:var(--radius);padding:12px 12px 24px 50px;}
  .time-grid-inner{position:relative;}
  .time-row{position:relative;height:30px;border-top:1px dashed rgba(95,99,104,0.3);}
  .time-row.hour{border-top:1px solid var(--border);}
  .time-row:first-child{border-top:1px solid var(--border);}
  .time-label{position:absolute;left:-44px;top:-7px;font-size:10px;color:var(--text-muted);width:40px;text-align:right;font-family:'Outfit',monospace;}
  .time-row.drop-over{background:var(--accent-dim);}
  .time-end-label{position:absolute;left:-44px;font-size:10px;color:var(--text-muted);width:40px;text-align:right;font-family:'Outfit',monospace;}

  .block{position:absolute;left:6px;right:6px;padding:6px 10px;border-radius:var(--radius-sm);border-left:3px solid var(--text-muted);background:var(--bg-tertiary);cursor:grab;overflow:hidden;z-index:1;box-shadow:0 2px 6px var(--shadow);user-select:none;}
  .block:hover{filter:brightness(1.15);z-index:2;}
  .block.dragging{opacity:.4;}
  .block-row{display:flex;align-items:flex-start;gap:8px;height:100%;}
  .block-text{flex:1;min-width:0;font-size:12px;color:var(--text-primary);line-height:1.3;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-weight:500;}
  .block-time{flex-shrink:0;font-size:10px;color:var(--text-secondary);}
  .block-handle{position:absolute;left:0;right:0;height:6px;cursor:ns-resize;background:transparent;z-index:3;}
  .block-handle.top{top:-3px;}
  .block-handle.bot{bottom:-3px;}

  /* Docs entry buttons */
  .docs-bar{display:flex;gap:10px;justify-content:center;width:100%;max-width:1100px;padding:0 16px;margin-bottom:20px;}
  .docs-btn{flex:1;max-width:220px;padding:8px 14px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;}
  .docs-btn:hover{background:var(--bg-tertiary);border-color:var(--accent);color:var(--accent);}

  /* Docs picker / list */
  .modal.docs-picker{width:560px;}
  .modal.docs-list{width:640px;}
  .docs-card{padding:14px 16px;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:8px;transition:all .15s;}
  .docs-card:hover{background:var(--bg-tertiary);border-color:var(--accent);}
  .docs-card-label{font-size:14px;color:var(--text-primary);font-weight:500;margin-bottom:2px;}
  .docs-card-meta{font-size:11px;color:var(--text-muted);}
  .docs-empty{color:var(--text-muted);text-align:center;padding:24px;font-size:13px;}

  /* Docs editor (full-screen-ish overlay) */
  .docs-editor-overlay{background:rgba(0,0,0,0.85);}
  .docs-editor{background:var(--bg-primary);width:min(900px,96vw);max-height:92vh;display:flex;flex-direction:column;border-radius:var(--radius);box-shadow:0 8px 32px var(--shadow);overflow:hidden;}
  .docs-editor-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bg-tertiary);background:var(--bg-secondary);flex-shrink:0;}
  .docs-editor-title{flex:1;height:36px;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:0 12px;color:var(--text-primary);font-size:15px;font-weight:600;font-family:inherit;outline:none;}
  .docs-editor-title:focus{border-color:var(--accent);}
  .docs-editor-cat{height:36px;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:0 10px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;cursor:pointer;flex-shrink:0;}
  .docs-editor-cat:focus{border-color:var(--accent);}
  .docs-editor-cat option{background:var(--bg-primary);color:var(--text-primary);}
  .docs-editor-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}
  .docs-editor-actions .btn-save{padding:8px 18px;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;background:var(--accent);color:#202124;font-weight:600;transition:background .15s;}
  .docs-editor-actions .btn-save:hover{background:var(--accent-hover);}
  .docs-editor-close{width:32px;height:32px;background:var(--bg-tertiary);border:none;border-radius:50%;color:var(--text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
  .docs-editor-close:hover{background:var(--danger-dim);color:var(--danger);}
  .docs-editor-meta{padding:6px 20px;font-size:11px;color:var(--text-muted);background:var(--bg-secondary);border-bottom:1px solid var(--bg-tertiary);flex-shrink:0;}
  .docs-editor-meta:empty{display:none;}
  .docs-editor-body{padding:18px 22px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent;}
  .docs-editor-body::-webkit-scrollbar{width:6px;}
  .docs-editor-body::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px;}
  .docs-section{margin-bottom:18px;}
  .docs-section-q{display:block;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
  .docs-section-a{width:100%;min-height:180px;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text-primary);font-size:13px;line-height:1.55;font-family:inherit;outline:none;resize:vertical;}
  .docs-section-a:focus{border-color:var(--accent);}
  .docs-section-a.has-hint{color:var(--text-muted);font-style:italic;}

  /* Project Chart */
  .pc-section{width:100%;max-width:1100px;padding:0 16px;margin-bottom:28px;}
  .pc-section-inner{background:var(--bg-secondary);border-radius:var(--radius);padding:18px 22px;box-shadow:3px 3px 10px rgba(0,0,0,0.35),-1px -1px 4px rgba(255,255,255,0.02);}
  .pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .pc-title{font-size:14px;font-weight:600;color:var(--text-primary);}
  .pc-add-btn{padding:6px 12px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(138,180,248,0.25);border-radius:14px;font-size:11px;font-family:inherit;cursor:pointer;transition:all .15s;}
  .pc-add-btn:hover{background:var(--accent);color:#202124;border-color:var(--accent);}
  .pc-list{display:flex;flex-direction:column;gap:4px;}
  .pc-row{display:flex;align-items:center;gap:14px;padding:8px 6px;cursor:pointer;border-radius:var(--radius-sm);transition:background .15s;}
  .pc-row:hover{background:rgba(255,255,255,0.035);}
  .pc-name-col{flex-shrink:0;width:140px;min-width:0;}
  .pc-name{font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .pc-name-sub{font-size:10px;margin-top:2px;font-family:'Outfit',monospace;letter-spacing:0.3px;}
  .pc-name-sub.green{color:var(--success);}
  .pc-name-sub.yellow{color:var(--warning);}
  .pc-name-sub.red{color:var(--danger);}
  .pc-bar-col{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .pc-current-step{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
  .pc-bar-track{width:100%;height:18px;background:var(--bg-primary);border-radius:9px;overflow:hidden;box-shadow:inset 2px 2px 5px rgba(0,0,0,0.45),inset -1px -1px 2px rgba(255,255,255,0.03);position:relative;}
  .pc-bar-track::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background-image:repeating-linear-gradient(to bottom,rgba(255,255,255,0.38) 0 2px,transparent 2px 4px),repeating-linear-gradient(to bottom,rgba(255,255,255,0.38) 0 2px,transparent 2px 4px),repeating-linear-gradient(to bottom,rgba(255,255,255,0.38) 0 2px,transparent 2px 4px),repeating-linear-gradient(to bottom,rgba(255,255,255,0.38) 0 2px,transparent 2px 4px);background-size:1px 100%;background-repeat:no-repeat;background-position:20% 0,40% 0,60% 0,80% 0;}
  .pc-bar-fill{height:100%;border-radius:9px;transition:width .4s ease;}
  .pc-bar-fill.green{background:linear-gradient(135deg,#81c995,#5da97a);box-shadow:0 0 8px rgba(129,201,149,0.28);}
  .pc-bar-fill.yellow{background:linear-gradient(135deg,#fdd663,#d4af3e);box-shadow:0 0 8px rgba(253,214,99,0.28);}
  .pc-bar-fill.red{background:linear-gradient(135deg,#f28b82,#c46962);box-shadow:0 0 8px rgba(242,139,130,0.28);}
  .pc-pct{flex-shrink:0;width:56px;text-align:right;font-size:13px;font-weight:600;font-family:'Outfit',monospace;}
  .pc-pct.green{color:var(--success);}
  .pc-pct.yellow{color:var(--warning);}
  .pc-pct.red{color:var(--danger);}
  .pc-empty{text-align:center;color:var(--text-muted);font-size:12px;padding:18px 0;}

  /* Project Chart modal */
  .modal.pc-modal{width:520px;max-height:90vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg-tertiary) transparent;}
  .modal.pc-modal::-webkit-scrollbar{width:5px;}
  .modal.pc-modal::-webkit-scrollbar-thumb{background:var(--bg-tertiary);border-radius:4px;}
  .pc-modal textarea{width:100%;background:var(--bg-primary);border:1px solid var(--bg-tertiary);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;resize:vertical;min-height:60px;margin-bottom:14px;}
  .pc-modal textarea:focus{border-color:var(--accent);}
  .pc-task-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .pc-task-row .pc-task-check{width:18px;height:18px;flex-shrink:0;accent-color:var(--success);margin:0;cursor:pointer;}
  .pc-task-row .pc-task-text{flex:1;height:34px;margin:0;}
  .pc-task-row .pc-task-text.done{text-decoration:line-through;color:var(--text-muted);}
  .pc-task-row .pc-task-del{width:28px;height:28px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;font-family:inherit;}

<script src="https://accounts.google.com/gsi/client" onload="onGsiLoad()" async defer></script>
<script>
// ── Config ──
const CLIENT_ID='676989045728-c3bavcs39ppmvvekb92lbnmssrs66bkj.apps.googleusercontent.com';
// drive.appdata kept only for one-time migration; drive.file is the new home for all reads/writes.
const SCOPES='openid email profile https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const SCOPE_VERSION='v2-folder';
const FOLDER_NAME='.my-start-page';
const CAT_COLOR={'피치':'#f28b82','BCI':'#fdd663','타이탄':'#a8b8c4','오로라':'#81c995','개인플젝':'#8ab4f8','기타':'#9aa0a6'};
const SLOT_MIN=30, SLOT_PX=30, HOUR_START=6, HOUR_END=24;
const SLOT_COUNT=(HOUR_END-HOUR_START)*60/SLOT_MIN;   // 36

// ── State ──
let shortcuts=[], bookmarks=[], templates=[];
let docList=[], editorState=null, editorDraftTimer=null;
let dailyJob={items:[],lastResetDate:''};
let brainDump=[];
let timeplanByDate={};   // { 'YYYY-MM-DD': [blocks] }
let projects=[];   // [{id,name,purpose,tasks:[{id,text,done}],startDate,dueDate,createdAt}]
let pcModalState={editing:null,tasks:[]};
let currentDate=getPlannerDate();
let userProfile=null, editingBrainId=null, editingBlockId=null, dragData=null;

// ── Auth (Google Identity Services) ──
let tokenClient=null, accessToken=null, tokenExpiry=0;
function isTokenValid(){return !!accessToken && Date.now()<tokenExpiry-60000;}

async function onGsiLoad(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES, prompt:'',
    callback:onTokenResponse
  });
  const t=localStorage.getItem('drive_token'),
        e=parseInt(localStorage.getItem('drive_token_expiry')||'0'),
        p=localStorage.getItem('drive_user'),
        sv=localStorage.getItem('drive_scope_version');
  if(p){try{userProfile=JSON.parse(p);}catch(_){}}
  // Force re-consent if scope set changed (drive.appdata → +drive.file)
  if(sv!==SCOPE_VERSION){
    localStorage.removeItem('drive_token');
    localStorage.removeItem('drive_token_expiry');
    renderAuth();
    return;
  }
  if(t && Date.now()<e-60000){
    accessToken=t; tokenExpiry=e;
    renderAuth(); loadAllFromDrive();
  }else if(p){
    renderAuth();
    if(await refreshToken()){renderAuth(); loadAllFromDrive();}
  }else{
    renderAuth();
  }
}

function onTokenResponse(r){
  if(r && r.access_token){
    accessToken=r.access_token;
    tokenExpiry=Date.now()+(r.expires_in||3600)*1000;
    localStorage.setItem('drive_token',accessToken);
    localStorage.setItem('drive_token_expiry',tokenExpiry+'');
    localStorage.setItem('drive_scope_version',SCOPE_VERSION);
    fetchUserProfile().then(()=>{renderAuth(); loadAllFromDrive();});
  }else{
    console.error('token response failed',r);
    alert('Google 로그인 실패');
  }
}

async function fetchUserProfile(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}});
    if(!r.ok)return;
    const d=await r.json();
    userProfile={email:d.email,name:d.name,picture:d.picture};
    localStorage.setItem('drive_user',JSON.stringify(userProfile));
  }catch(e){console.error('userinfo failed',e);}
}

function doLogin(){
  if(!tokenClient){alert('Google 라이브러리 로딩 중. 잠시 후 다시 시도하세요.');return;}
  tokenClient.requestAccessToken({prompt:'consent'});
}

function doLogout(){
  if(accessToken)try{google.accounts.oauth2.revoke(accessToken,()=>{});}catch(_){}
  accessToken=null; tokenExpiry=0; userProfile=null;
  localStorage.removeItem('drive_token');
  localStorage.removeItem('drive_token_expiry');
  localStorage.removeItem('drive_user');
  renderAuth();
}

function renderAuth(){
  const bar=document.getElementById('authBar');
  if(isTokenValid()){
    const p=userProfile||{};
    bar.innerHTML=`<span class="sync-badge">Drive 연결</span>`
      +(p.name||p.email?`<span class="user-name">${escapeHtml(p.name||p.email)}</span>`:'')
      +(p.picture?`<img class="user-avatar" src="${p.picture}" title="로그아웃" onclick="doLogout()">`:'')
      +`<button class="btn-auth logout" onclick="doLogout()">로그아웃</button>`;
  }else{
    bar.innerHTML='<button class="btn-auth" onclick="doLogin()">Google 로그인</button>';
  }
}

// ── Drive API wrapper (regular folder, name in FOLDER_NAME) ──
const DRIVE_API='https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3';

let appFolderId=null;
let folderLookupPromise=null;

// Find-or-create the app folder. drive.file scope only sees folders this app created,
// so a name search is reliable across sessions; we cache the ID in memory for the session.
async function driveGetFolderId(){
  if(appFolderId)return appFolderId;
  if(folderLookupPromise)return folderLookupPromise;
  folderLookupPromise=(async()=>{
    if(!isTokenValid())return null;
    const q=`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r=await driveFetchJson(`${DRIVE_API}/files?q=${encodeURIComponent(q)}&fields=files(id,name)`);
    if(r && r.files && r.files.length){
      appFolderId=r.files[0].id;
    }else{
      const meta={name:FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'};
      const c=await driveFetchJson(`${DRIVE_API}/files?fields=id`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(meta)
      });
      if(c && c.id)appFolderId=c.id;
    }
    return appFolderId;
  })();
  try{return await folderLookupPromise;}
  finally{folderLookupPromise=null;}
}

async function driveFind(name){
  const folderId=await driveGetFolderId();
  if(!folderId)return null;
  const q=`name='${name}' and '${folderId}' in parents and trashed=false`;
  const r=await driveFetchJson(`${DRIVE_API}/files?q=${encodeURIComponent(q)}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc`);
  if(!r||!r.files||!r.files.length)return null;
  return r.files[0];
}

async function driveLoad(fileId){
  return driveFetchJson(`${DRIVE_API}/files/${fileId}?alt=media`);
}

async function driveCreate(name,content){
  const folderId=await driveGetFolderId();
  if(!folderId)return null;
  const metadata={name,parents:[folderId]};
  const boundary='-----'+Math.random().toString(36).slice(2);
  const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(content)}\r\n--${boundary}--`;
  return driveFetchJson(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`,{
    method:'POST',
    headers:{'Content-Type':`multipart/related; boundary=${boundary}`},
    body
  });
}

async function driveUpdate(fileId,content){
  return driveFetchJson(`${DRIVE_UPLOAD}/files/${fileId}?uploadType=media`,{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(content)
  });
}

async function driveSave(name,content){
  if(!isTokenValid())return;
  try{
    const existing=await driveFind(name);
    if(existing)await driveUpdate(existing.id,content);
    else await driveCreate(name,content);
  }catch(e){console.error('drive save failed',name,e);}
}

async function driveFetchJson(url,opts={}){
  if(!isTokenValid())return null;
  opts.headers=Object.assign({Authorization:'Bearer '+accessToken},opts.headers||{});
  let r;
  try{r=await fetch(url,opts);}catch(e){console.error('drive fetch network error',e);return null;}
  if(r.status===401){
    // try silent refresh once
    const ok=await refreshToken();
    if(!ok)return null;
    opts.headers.Authorization='Bearer '+accessToken;
    try{r=await fetch(url,opts);}catch(e){return null;}
  }
  if(!r.ok){console.error('drive fetch failed',url,r.status);return null;}
  if(r.status===204)return null;
  return r.json();
}

function refreshToken(){
  return new Promise(res=>{
    if(!tokenClient){res(false);return;}
    const orig=tokenClient.callback;
    tokenClient.callback=(tr)=>{
      tokenClient.callback=orig;
      if(tr && tr.access_token){
        accessToken=tr.access_token;
        tokenExpiry=Date.now()+(tr.expires_in||3600)*1000;
        localStorage.setItem('drive_token',accessToken);
        localStorage.setItem('drive_token_expiry',tokenExpiry+'');
        res(true);
      }else res(false);
    };
    try{tokenClient.requestAccessToken({prompt:''});}catch(e){tokenClient.callback=orig;res(false);}
  });
}

// ── localStorage cache ──
function cacheGet(key){try{return JSON.parse(localStorage.getItem('hp:'+key));}catch(_){return null;}}
function cacheSet(key,val){try{localStorage.setItem('hp:'+key,JSON.stringify(val));}catch(_){}}

// ── Date helpers ──
function getPlannerDate(){
  // KST date, but rolls over at 06:00 instead of 00:00
  const n=new Date();
  const kst=new Date(n.getTime()+(9*3600000));
  if(kst.getUTCHours()<6)kst.setUTCDate(kst.getUTCDate()-1);
  return kst.toISOString().slice(0,10);
}
function addDays(date,n){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dowKor(date){return ['일','월','화','수','목','금','토'][new Date(date+'T00:00:00Z').getUTCDay()];}

// ── Helpers ──
function escapeHtml(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return String(n).padStart(2,'0');}
function minToTime(m){return pad2(Math.floor(m/60))+':'+pad2(m%60);}
function timeToMin(hhmm){const [h,m]=hhmm.split(':').map(Number);return h*60+m;}

// ── Search ──
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;
  if(/^https?:\/\//i.test(q)||/^[a-z0-9-]+\.[a-z]{2,}/i.test(q)){window.location.href=q.startsWith('http')?q:'https://'+q;}
  else{window.location.href='https://www.google.com/search?q='+encodeURIComponent(q);}}

// One-time copy of pre-existing appDataFolder contents into the new visible folder.
// Safe to run repeatedly: skips files that already exist in the destination.
async function migrateFromAppData(){
  if(localStorage.getItem('hp:migrated_v2'))return;
  if(!isTokenValid())return;
  try{
    const r=await driveFetchJson(`${DRIVE_API}/files?spaces=appDataFolder&q=trashed=false&fields=files(id,name)&pageSize=1000`);
    if(!r)return; // network/scope failure - retry on next load
    if(!r.files||!r.files.length){
      localStorage.setItem('hp:migrated_v2','1');
      return;
    }
    const folderId=await driveGetFolderId();
    if(!folderId)return;
    let migrated=0, skipped=0;
    for(const f of r.files){
      const existing=await driveFind(f.name);
      if(existing){skipped++;continue;}
      const content=await driveLoad(f.id);
      if(content===null)continue;
      const c=await driveCreate(f.name,content);
      if(c)migrated++;
    }
    console.log(`[migration] ${migrated} files copied to ${FOLDER_NAME}, ${skipped} already present`);
    localStorage.setItem('hp:migrated_v2','1');
  }catch(e){console.error('migration failed',e);}
}

function renderTimePlan(){
  const grid=document.getElementById('tpGrid');
  document.getElementById('tpDate').value=currentDate;
  document.getElementById('tpDow').textContent='('+dowKor(currentDate)+')';

  let rowsHtml='';
  for(let i=0;i<SLOT_COUNT;i++){
    const time=minToTime(HOUR_START*60+i*SLOT_MIN);
    const isHour=time.endsWith(':00');
    rowsHtml+=`<div class="time-row ${isHour?'hour':''}" data-slot="${i}" ondragover="onSlotDragOver(event)" ondragleave="onSlotDragLeave(event)" ondrop="onSlotDrop(event,${i})">${isHour?`<span class="time-label">${time}</span>`:''}</div>`;
  }
  // closing 24:00 label
  rowsHtml+=`<span class="time-end-label" style="top:${SLOT_COUNT*SLOT_PX-7}px;">${HOUR_END===24?'24:00':minToTime(HOUR_END*60)}</span>`;

  const blocks=timeplanByDate[currentDate]||[];
  let blocksHtml='';
  blocks.forEach(b=>{
    const startMin=timeToMin(b.start), endMin=timeToMin(b.end);
    const top=((startMin-HOUR_START*60)/SLOT_MIN)*SLOT_PX;
    const height=Math.max(SLOT_PX-2,((endMin-startMin)/SLOT_MIN)*SLOT_PX-2);
    const color=CAT_COLOR[b.category]||CAT_COLOR['기타'];
    const bg=color+'33';
    blocksHtml+=`<div class="block" style="top:${top}px;height:${height}px;border-left-color:${color};background:${bg};" draggable="true" data-id="${b.id}" ondragstart="onBlockDragStart(event,'${b.id}')" onclick="blockOpenEdit('${b.id}')">
      <div class="block-handle top" onmousedown="onBlockResize(event,'${b.id}','top')"></div>
      <div class="block-row">
        <div class="block-text">${escapeHtml(b.text)}</div>
        <div class="block-time">${b.start} – ${b.end}</div>
      </div>
      <div class="block-handle bot" onmousedown="onBlockResize(event,'${b.id}','bot')"></div>
    </div>`;
  });

  grid.innerHTML=rowsHtml+blocksHtml;
  grid.style.height=(SLOT_COUNT*SLOT_PX)+'px';
}

// ── Drag handlers (HTML5 native drag) ──
function onDragStart(ev,type,id){
  dragData={type,id};
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',id);
}
function onBlockDragStart(ev,id){
  dragData={type:'block',id};
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',id);
  ev.currentTarget.classList.add('dragging');
}
function onSlotDragOver(ev){
  if(!dragData)return;
  ev.preventDefault();
  ev.currentTarget.classList.add('drop-over');
}
function onSlotDragLeave(ev){ev.currentTarget.classList.remove('drop-over');}

function onSlotDrop(ev,slot){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drop-over');
  if(!dragData){onGlobalDragEnd();return;}

  const blocks=timeplanByDate[currentDate]||(timeplanByDate[currentDate]=[]);
  const slotStartMin=HOUR_START*60+slot*SLOT_MIN;

  if(dragData.type==='bd'){
    const src=brainDump.find(b=>b.id===dragData.id);
    if(src){
      blocks.push({id:uid(),start:minToTime(slotStartMin),end:minToTime(Math.min(slotStartMin+2*SLOT_MIN,HOUR_END*60)),text:src.name,category:src.category,sourceType:'brainDump'});
      brainDump=brainDump.filter(b=>b.id!==dragData.id);
      saveBrainDump();renderBrainDump();
    }
  }else if(dragData.type==='dj'){
    const src=dailyJob.items.find(i=>i.id===dragData.id);
    if(src){
      blocks.push({id:uid(),start:minToTime(slotStartMin),end:minToTime(Math.min(slotStartMin+2*SLOT_MIN,HOUR_END*60)),text:src.text,category:'기타',sourceType:'dailyJob'});
      dailyJob.items=dailyJob.items.filter(i=>i.id!==dragData.id);
      saveDailyJob();renderDailyJob();
    }
  }else if(dragData.type==='block'){
    const blk=blocks.find(b=>b.id===dragData.id);
    if(blk){
      const dur=timeToMin(blk.end)-timeToMin(blk.start);
      const ns=Math.max(HOUR_START*60,Math.min(HOUR_END*60-dur,slotStartMin));
      blk.start=minToTime(ns);
      blk.end=minToTime(ns+dur);
    }
  }
  dragData=null;
  saveTimeplan(currentDate);renderTimePlan();
}

function onGlobalDragEnd(){
  document.querySelectorAll('.block.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.time-row.drop-over').forEach(el=>el.classList.remove('drop-over'));
  dragData=null;
}

// ── Block resize (mouse-based, snap to 30-min) ──
function onBlockResize(ev,id,which){
  ev.stopPropagation();
  ev.preventDefault();
  const blocks=timeplanByDate[currentDate]||[];
  const blk=blocks.find(b=>b.id===id);if(!blk)return;
  const startY=ev.clientY;
  const initStart=timeToMin(blk.start), initEnd=timeToMin(blk.end);
  function onMove(e){
    const dy=e.clientY-startY;
    const dSlot=Math.round(dy/SLOT_PX);
    const dMin=dSlot*SLOT_MIN;
    if(which==='top'){
      const ns=Math.max(HOUR_START*60,Math.min(initEnd-SLOT_MIN,initStart+dMin));
      blk.start=minToTime(ns);
    }else{
      const ne=Math.max(initStart+SLOT_MIN,Math.min(HOUR_END*60,initEnd+dMin));
      blk.end=minToTime(ne);
    }
    renderTimePlan();
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    saveTimeplan(currentDate);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ── Project Chart ──
function pcStatus(p){
  const total=(p.tasks||[]).length;
  const done=(p.tasks||[]).filter(t=>t.done).length;
  const pct=total?done/total*100:0;
  let color='green';
  if(total && done<total && p.startDate && p.dueDate){
    const now=Date.now();
    const start=new Date(p.startDate+'T00:00:00').getTime();
    const due=new Date(p.dueDate+'T23:59:59').getTime();
    const span=Math.max(due-start,1);
    let timePct=(now-start)/span*100;
    if(timePct<0)timePct=0; if(timePct>100)timePct=100;
    const delay=timePct-pct;
    if(delay>=40)color='red';
    else if(delay>=20)color='yellow';
  }
  return {pct,color};
}
function pcDDay(dueDate){
  if(!dueDate)return '';
  const d=new Date(dueDate+'T00:00:00'); d.setHours(0,0,0,0);
  const n=new Date(); n.setHours(0,0,0,0);
  const days=Math.round((d-n)/86400000);
  if(days>0)return `D-${days}`;
  if(days===0)return 'D-DAY';
  return `D+${-days}`;
}
function pcFmtPct(v){return (v%1===0?v.toFixed(0):v.toFixed(1))+'%';}

function renderProjects(){
  const list=document.getElementById('pcList');
  if(!list)return;
  if(!projects.length){
    list.innerHTML='<div class="pc-empty">아직 등록된 프로젝트가 없습니다. 우측 상단 + 버튼으로 추가하세요.</div>';
    return;
  }
  list.innerHTML=projects.map(p=>{
    const s=pcStatus(p);
    const pctTxt=pcFmtPct(s.pct);
    const dday=pcDDay(p.dueDate);
    const next=(p.tasks||[]).find(t=>!t.done);
    const step=next?`현재단계 - ${escapeHtml(next.text)}`:`현재단계 - 완료`;
    return `<div class="pc-row" onclick="pcOpenEdit('${escapeHtml(p.id)}')" title="${escapeHtml(p.name)} (${pctTxt} / ${dday})">`
      +`<div class="pc-name-col">`
        +`<div class="pc-name">${escapeHtml(p.name)}</div>`
        +`<div class="pc-name-sub ${s.color}">${escapeHtml(dday)}</div>`
      +`</div>`
      +`<div class="pc-bar-col">`
        +`<div class="pc-current-step">${step}</div>`
        +`<div class="pc-bar-track"><div class="pc-bar-fill ${s.color}" style="width:${s.pct}%"></div></div>`
      +`</div>`
      +`<div class="pc-pct ${s.color}">${pctTxt}</div>`
    +`</div>`;
  }).join('');
}

function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addMonths(date,n){const d=new Date(date.getTime());d.setMonth(d.getMonth()+n);return d;}

function pcRenderModalTasks(){
  const isEdit=!!pcModalState.editing;
  const wrap=document.getElementById('pcTasks');
  wrap.innerHTML=pcModalState.tasks.map((t,i)=>(
    `<div class="pc-task-row">`
    +(isEdit?`<input type="checkbox" class="pc-task-check" data-i="${i}"${t.done?' checked':''}>`:'')

    +`<button type="button" class="pc-task-del" data-i="${i}" title="제거">×</button>`
    +`</div>`
  )).join('');
  document.getElementById('pcTaskAddBtn').style.display=pcModalState.tasks.length>=10?'none':'block';
  wrap.querySelectorAll('.pc-task-text').forEach(el=>{
    el.oninput=e=>{pcModalState.tasks[+e.target.dataset.i].text=e.target.value;};
    el.onkeydown=e=>{
      if(e.key!=='Enter'||e.isComposing||e.shiftKey)return;
      e.preventDefault();
      const i=+e.target.dataset.i;
      const inps=wrap.querySelectorAll('.pc-task-text');
      if(i<inps.length-1){inps[i+1].focus();return;}
      if(e.target.value.trim() && pcModalState.tasks.length<10)pcAddTask();

  });
  wrap.querySelectorAll('.pc-task-check').forEach(el=>{
    el.onchange=e=>{
      const i=+e.target.dataset.i;
      pcModalState.tasks[i].done=e.target.checked;
      const txt=wrap.querySelector(`.pc-task-text[data-i="${i}"]`);

      if(pcModalState.tasks.length<=1){alert('최소 1개의 태스크가 필요합니다.');return;}

  if(!p)return;
  pcModalState={editing:id,tasks:(p.tasks||[]).map(t=>({...t}))};
  document.getElementById('pcModalTitle').textContent='프로젝트 편집';
  document.getElementById('pcDeleteBtn').style.display='inline-block';
  document.getElementById('pcName').value=p.name||'';
  document.getElementById('pcPurpose').value=p.purpose||'';
  document.getElementById('pcDueDate').value=p.dueDate||'';
  pcRenderModalTasks();
  pcSyncDueChip();
  document.getElementById('pcModal').classList.add('active');
}
function pcClose(){document.getElementById('pcModal').classList.remove('active');}
function pcAddTask(){
  if(pcModalState.tasks.length>=10){alert('최대 10개까지만 등록할 수 있습니다.');return;}
  pcModalState.tasks.push({id:uid(),text:'',done:false});
  pcRenderModalTasks();
  setTimeout(()=>{
    const inps=document.querySelectorAll('#pcTasks .pc-task-text');
    if(inps.length)inps[inps.length-1].focus();
  },0);
}
function pcSetDuePreset(months){
  document.getElementById('pcDueDate').value=isoDate(addMonths(new Date(),months));
  pcSyncDueChip();
}
function pcSyncDueChip(){
  const dv=document.getElementById('pcDueDate').value;
  document.querySelectorAll('#pcDueChips button').forEach(b=>{
    const m=+b.dataset.months;
    b.classList.toggle('active', dv===isoDate(addMonths(new Date(),m)));
  });
}
function pcSave(){
  const name=document.getElementById('pcName').value.trim();
  const purpose=document.getElementById('pcPurpose').value.trim();
  const dueDate=document.getElementById('pcDueDate').value;
  if(!name){alert('프로젝트명을 입력하세요.');return;}
  const tasks=pcModalState.tasks.map(t=>({...t,text:t.text.trim()})).filter(t=>t.text);
  if(!tasks.length){alert('세부 태스크를 1개 이상 입력하세요.');return;}
  if(tasks.length>10){alert('최대 10개까지만 등록할 수 있습니다.');return;}
  if(!dueDate){alert('마감일을 선택하세요.');return;}
  if(pcModalState.editing){
    const p=projects.find(x=>x.id===pcModalState.editing);
    if(!p)return;
    p.name=name; p.purpose=purpose; p.dueDate=dueDate; p.tasks=tasks;
  }else{
    projects.push({
      id:uid(),name,purpose,tasks,
      startDate:isoDate(new Date()),
      dueDate,
      createdAt:new Date().toISOString()
    });
  }
  saveProjects(); renderProjects(); pcClose();
}
function pcDelete(){
  if(!pcModalState.editing)return;
  if(!confirm('이 프로젝트를 삭제할까요?'))return;
  projects=projects.filter(p=>p.id!==pcModalState.editing);
  saveProjects(); renderProjects(); pcClose();
}

// ── Docs (templates + project documents) ──
const DOCS_DRAFT_KEY='hp:docs_draft';

function docsOpenNew(){
  if(!templates.length){alert('템플릿을 불러오는 중입니다. 잠시 후 다시 시도하세요.');return;}
  docsRenderPicker();
  document.getElementById('docsPickerModal').classList.add('active');
}
function docsClosePicker(){document.getElementById('docsPickerModal').classList.remove('active');}
function docsRenderPicker(){
  document.getElementById('docsPickerList').innerHTML=templates.map(t=>
    `<div class="docs-card" onclick="docsPick('${escapeHtml(t.id)}')">`
    +`<div class="docs-card-label">${escapeHtml(t.label)}</div>`
    +`<div class="docs-card-meta">${t.sections?t.sections.length:0}개 섹션</div>`
    +`</div>`
  ).join('');
}
function docsPick(id){
  const t=templates.find(x=>x.id===id);
  if(!t)return;
  docsClosePicker();
  docsEditorOpen({
    templateId:t.id,
    docId:null,
    title:'',
    category:'기타',
    sections:(t.sections||[]).map(s=>({q:s.q,hint:s.hint||'',a:s.hint||''}))
  });
}

// ── Editor ──
function docsEditorOpen(state){
  editorState={dirty:false,createdAt:null,category:'기타',favorite:false,...state};
  document.getElementById('docsEditorTitle').value=editorState.title||'';
  document.getElementById('docsEditorCat').value=editorState.category||'기타';
  const tpl=templates.find(t=>t.id===editorState.templateId);
  document.getElementById('docsEditorMeta').textContent=
    (tpl?tpl.label:'')
    +(editorState.docId&&editorState.updatedAt?` · 수정: ${editorState.updatedAt.slice(0,16).replace('T',' ')}`:'');
  docsRenderEditorBody();
  document.getElementById('docsEditorModal').classList.add('active');
  document.getElementById('docsEditorTitle').oninput=(e)=>{
    editorState.title=e.target.value;
    editorState.dirty=true;
    docsScheduleDraft();
  };
  document.getElementById('docsEditorCat').onchange=(e)=>{
    editorState.category=e.target.value;
    editorState.dirty=true;
    docsScheduleDraft();
  };
  if(!editorState.docId)docsTryRestoreDraft();
}
function docsRenderEditorBody(){
  const body=document.getElementById('docsEditorBody');
  body.innerHTML=editorState.sections.map((s,i)=>{
    const isHint=s.a===s.hint && s.hint!=='';
    return `<div class="docs-section">`
      +`<label class="docs-section-q">${escapeHtml(s.q)}</label>`
      +`<textarea class="docs-section-a${isHint?' has-hint':''}" data-idx="${i}" oninput="docsOnSectionInput(this)" rows="8">${escapeHtml(s.a)}</textarea>`
      +`</div>`;
  }).join('');
}
function docsOnSectionInput(el){
  const idx=+el.dataset.idx;
  editorState.sections[idx].a=el.value;
  if(el.classList.contains('has-hint'))el.classList.remove('has-hint');
  editorState.dirty=true;
  docsScheduleDraft();
}
function docsEditorClose(){
  if(editorState && editorState.dirty){
    if(!confirm('작성 중인 내용이 사라집니다. 닫을까요?'))return;
  }
  document.getElementById('docsEditorModal').classList.remove('active');
  docsClearDraft();
  editorState=null;
}
async function docsEditorSave(){
  if(!editorState)return;
  if(!isTokenValid()){alert('Google 로그인이 필요합니다.');return;}
  if(!editorState.title.trim()){
    const tpl=templates.find(t=>t.id===editorState.templateId);
    const label=tpl?tpl.label:'문서';
    const d=new Date();
    const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    editorState.title=`${label}_${stamp}`;
    document.getElementById('docsEditorTitle').value=editorState.title;
  }
  const now=new Date().toISOString();
  const doc={
    id:editorState.docId||uid(),
    templateId:editorState.templateId,
    title:editorState.title,
    category:editorState.category||'기타',
    favorite:!!editorState.favorite,
    createdAt:editorState.createdAt||now,
    updatedAt:now,
    sections:editorState.sections.map(s=>({q:s.q,a:s.a}))
  };
  const fname=`doc-${doc.id}.json`;
  const ok=await docsSaveToDrive(fname,doc);
  if(!ok){alert('저장 실패. 네트워크 또는 권한을 확인하세요. (작성 중 내용은 보존됩니다)');return;}
  editorState.dirty=false;
  docsClearDraft();
  document.getElementById('docsEditorModal').classList.remove('active');
  editorState=null;
}
async function docsSaveToDrive(fname,doc){
  if(!isTokenValid())return false;
  try{
    const existing=await driveFind(fname);
    if(existing)await driveUpdate(existing.id,doc);
    else await driveCreate(fname,doc);
    return true;
  }catch(e){console.error('docs save failed',fname,e);return false;}
}

// ── Draft auto-save (localStorage) ──
function docsScheduleDraft(){
  if(editorDraftTimer)clearTimeout(editorDraftTimer);
  editorDraftTimer=setTimeout(docsSaveDraft,300);
}
function docsSaveDraft(){
  if(!editorState)return;
  try{localStorage.setItem(DOCS_DRAFT_KEY,JSON.stringify({...editorState,savedAt:Date.now()}));}catch(_){}
}
function docsClearDraft(){try{localStorage.removeItem(DOCS_DRAFT_KEY);}catch(_){}}
function docsTryRestoreDraft(){
  let d;try{const raw=localStorage.getItem(DOCS_DRAFT_KEY);if(!raw)return;d=JSON.parse(raw);}catch(_){return;}
  if(!d||d.templateId!==editorState.templateId)return;
  if(!confirm('저장하지 않은 작성 중 문서가 있습니다. 복구하시겠습니까?')){docsClearDraft();return;}
  editorState={...d,dirty:true};
  document.getElementById('docsEditorTitle').value=editorState.title||'';
  document.getElementById('docsEditorCat').value=editorState.category||'기타';
  docsRenderEditorBody();
}

// ── List browser ──
async function docsOpenList(){
  document.getElementById('docsListModal').classList.add('active');
  const content=document.getElementById('docsListContent');
  if(!isTokenValid()){
    content.className='docs-list-loading';
    content.textContent='Google 로그인이 필요합니다.';
    return;
  }
  content.className='docs-list-loading';
  content.textContent='불러오는 중...';
  docList=await docsFetchAll();
  docsRenderList();
}
function docsCloseList(){document.getElementById('docsListModal').classList.remove('active');}

async function docsFetchAll(){
  const folderId=await driveGetFolderId();
  if(!folderId)return [];
  const q=`name contains 'doc-' and '${folderId}' in parents and trashed=false`;
  const r=await driveFetchJson(`${DRIVE_API}/files?q=${encodeURIComponent(q)}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=200`);
  if(!r||!r.files)return [];
  const docs=[];
  for(const f of r.files){
    if(!f.name.startsWith('doc-'))continue;
    const d=await driveLoad(f.id);
    if(d && d.id)docs.push({...d,_driveId:f.id});
  }
  return docs;
}
function docsRenderList(){
  const content=document.getElementById('docsListContent');
  if(!docList.length){
    content.className='docs-list-loading';
    content.textContent='저장된 문서가 없습니다.';
    return;
  }
  content.className='';
  const sorted=[...docList].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  const favs=sorted.filter(d=>d.favorite);
  const rest=sorted.filter(d=>!d.favorite);
  let html='';
  if(favs.length){
    html+=`<div class="docs-list-section-title">★ 즐겨찾는 문서</div>`;
    html+=favs.map(docsRenderRow).join('');
  }
  if(rest.length){
    if(favs.length)html+=`<div class="docs-list-section-title">전체 문서</div>`;
    html+=rest.map(docsRenderRow).join('');
  }
  content.innerHTML=html;
}
function docsRenderRow(d){
  const tpl=templates.find(t=>t.id===d.templateId);
  const tplLabel=tpl?tpl.label:(d.templateId||'');
  const upd=d.updatedAt?d.updatedAt.slice(0,16).replace('T',' '):'';
  const cat=d.category||'기타';
  const fav=!!d.favorite;
  const star=fav?'★':'☆';
  return `<div class="docs-list-row" ondblclick="docsListOpen('${escapeHtml(d.id)}')" title="더블클릭하여 열기">`
    +`<button class="docs-list-fav${fav?' active':''}" onclick="event.stopPropagation();docsToggleFav('${escapeHtml(d.id)}')" title="${fav?'즐겨찾기 해제':'즐겨찾기 추가'}">${star}</button>`
    +`<div class="docs-list-info">`
      +`<div class="docs-list-title">${escapeHtml(d.title||'(제목 없음)')}</div>`
      +`<div class="docs-list-meta">${escapeHtml(tplLabel)} · ${escapeHtml(cat)} · ${upd}</div>`
    +`</div>`
    +`<div class="docs-list-actions">`
      +`<button onclick="event.stopPropagation();docsListDownload('${escapeHtml(d.id)}','md')">.md</button>`
      +`<button onclick="event.stopPropagation();docsListDownload('${escapeHtml(d.id)}','txt')">.txt</button>`
      +`<button class="docs-list-del" onclick="event.stopPropagation();docsListDelete('${escapeHtml(d.id)}')">삭제</button>`
    +`</div>`
  +`</div>`;
}
async function docsToggleFav(id){
  const d=docList.find(x=>x.id===id);
  if(!d)return;
  if(!isTokenValid()){alert('Google 로그인이 필요합니다.');return;}
  const prev=!!d.favorite;
  d.favorite=!prev;
  docsRenderList();
  const {_driveId,...persist}=d;
  const ok=await docsSaveToDrive(`doc-${d.id}.json`,persist);
  if(!ok){
    d.favorite=prev;
    docsRenderList();
    alert('즐겨찾기 변경 저장에 실패했습니다.');
  }
}
function docsListOpen(id){
  const d=docList.find(x=>x.id===id);
  if(!d)return;
  const tpl=templates.find(t=>t.id===d.templateId);
  const tplSections=tpl?tpl.sections:[];
  const sections=(d.sections||[]).map((s,i)=>({
    q:s.q,
    hint:tplSections[i]?(tplSections[i].hint||''):'',
    a:s.a||''
  }));
  docsCloseList();
  docsEditorOpen({
    templateId:d.templateId,
    docId:d.id,
    title:d.title||'',
    category:d.category||'기타',
    favorite:!!d.favorite,
    createdAt:d.createdAt,
    updatedAt:d.updatedAt,
    sections
  });
}
function docsListDownload(id,fmt){
  const d=docList.find(x=>x.id===id);
  if(!d)return;
  docsDownload(d,fmt);
}
async function docsListDelete(id){
  if(!confirm('이 문서를 삭제할까요? Drive에서도 제거됩니다.'))return;
  const d=docList.find(x=>x.id===id);
  if(!d)return;
  let driveId=d._driveId;
  if(!driveId){
    const existing=await driveFind(`doc-${d.id}.json`);
    driveId=existing?existing.id:null;
  }
  if(driveId){
    const ok=await driveDelete(driveId);
    if(!ok){alert('삭제 실패');return;}
  }
  docList=docList.filter(x=>x.id!==id);
  docsRenderList();
}
async function driveDelete(fileId){
  if(!isTokenValid())return false;
  const doReq=()=>fetch(`${DRIVE_API}/files/${fileId}`,{method:'DELETE',headers:{Authorization:'Bearer '+accessToken}});
  try{
    let r=await doReq();
    if(r.status===401 && await refreshToken())r=await doReq();
    return r.ok || r.status===204;
  }catch(e){console.error('drive delete failed',e);return false;}
}

// ── Export to MD / TXT ──
function docsDownload(doc,fmt){
  const safe=(doc.title||'document').replace(/[\\/:*?"<>|]/g,'_');
  if(fmt==='md')downloadBlob(safe+'.md',docToMarkdown(doc),'text/markdown;charset=utf-8');
  else downloadBlob(safe+'.txt',docToText(doc),'text/plain;charset=utf-8');
}
function docToMarkdown(doc){
  const tpl=templates.find(t=>t.id===doc.templateId);
  let md=`# ${doc.title}\n\n`;
  if(tpl)md+=`> 템플릿: ${tpl.label}  \n`;
  if(doc.createdAt)md+=`> 작성: ${doc.createdAt}  \n`;
  if(doc.updatedAt)md+=`> 수정: ${doc.updatedAt}\n`;
  md+='\n---\n\n';
  for(const s of (doc.sections||[])){
    md+=`## ${s.q}\n\n${s.a||''}\n\n`;
  }
  return md;
}
function docToText(doc){
  const t=doc.title||'document';
  let txt=`${t}\n${'='.repeat(Math.max(t.length,4))}\n\n`;
  for(const s of (doc.sections||[])){
    txt+=`${s.q}\n${'-'.repeat(Math.max(s.q.length,4))}\n${s.a||''}\n\n`;
  }
  return txt;
}
function downloadBlob(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ── Master render ──
function renderAll(){renderAuth();renderBookmarks();renderShortcuts();renderProjects();renderDailyJob();renderBrainDump();renderTimePlan();}

(async()=>{

  const cDJ=cacheGet('dailyJob');if(cDJ)dailyJob=cDJ;

setInterval(()=>{
  if(dailyJob.lastResetDate!==getPlannerDate()){
    checkDailyJobReset();renderDailyJob();renderTimePlan();
  }
  renderProjects();
},60000);
